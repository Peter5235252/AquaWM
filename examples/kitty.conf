# aquawm example kitty config: copy to ~/.config/kitty/kitty.conf and tweak.
# See `kitty --help` and https://sw.kovidgoyal.net/kitty/conf/ for all options.

font_family monospace
font_size 11.0

# Quiet the terminal bell inside a tiling session.
enable_audio_bell no

# Slight transparency pairs well with the wallpaper behind tiling gaps.
background_opacity 0.95

# Don't ask when a shell command is still running and the window closes.
confirm_os_window_close 0
